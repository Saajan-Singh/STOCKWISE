<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Warehouse Access Terminal - Reorder Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#dce3f0",
                        "surface-tint": "#575f6d",
                        "surface-dim": "#d4dae7",
                        "secondary": "#8c4f00",
                        "on-background": "#151c25",
                        "background": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-high": "#e2e8f5",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#151c25",
                        "inverse-primary": "#bfc7d7",
                        "on-error": "#ffffff",
                        "secondary-container": "#fca956",
                        "on-tertiary-fixed-variant": "#2e4e37",
                        "tertiary-fixed": "#c7eccc",
                        "inverse-on-surface": "#eaf1fe",
                        "on-tertiary-container": "#709377",
                        "on-surface-variant": "#45474c",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#838b9a",
                        "surface-container-highest": "#dce3f0",
                        "surface-container-low": "#eef4ff",
                        "outline": "#75777c",
                        "tertiary-fixed-dim": "#abcfb1",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed-variant": "#6b3b00",
                        "outline-variant": "#c5c6cc",
                        "inverse-surface": "#2a313b",
                        "on-primary-fixed": "#141c28",
                        "primary": "#060e1a",
                        "primary-fixed": "#dbe3f3",
                        "surface-container": "#e7eefb",
                        "tertiary": "#001105",
                        "on-secondary-container": "#713f00",
                        "surface": "#f8f9ff",
                        "primary-container": "#1c2430",
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#2d1600",
                        "tertiary-container": "#082915",
                        "primary-fixed-dim": "#bfc7d7",
                        "secondary-fixed": "#ffdcbf",
                        "surface-bright": "#f8f9ff",
                        "on-primary-fixed-variant": "#3f4754",
                        "secondary-fixed-dim": "#ffb874",
                        "on-tertiary-fixed": "#01210e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "unit": "4px",
                        "stack-lg": "32px",
                        "margin-desktop": "32px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "label-caps": ["Space Grotesk"],
                        "headline-lg-mobile": ["Space Grotesk"],
                        "headline-lg": ["Space Grotesk"],
                        "headline-md": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "data-mono": ["14px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .dotted-bg {
            background-color: #f8f9ff;
            background-image: radial-gradient(#dce3f0 1.5px, transparent 1.5px);
            background-size: 16px 16px;
        }
        .btn-press:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px 0px rgba(6,14,26,1) !important;
        }
    </style>
</head>
<body class="dotted-bg min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface">
<div class="w-full max-w-md bg-surface-container-lowest border-2 border-primary shadow-[8px_8px_0px_0px_rgba(6,14,26,1)] relative overflow-hidden flex flex-col">
<!-- Header -->
<div class="p-stack-md border-b-2 border-primary bg-surface flex flex-col items-center justify-center space-y-stack-sm text-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">ACCESS TERMINAL</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="inventory_2" data-weight="fill" style="font-variation-settings: 'FILL' 1; font-size: 32px;">inventory_2</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary uppercase">REORDER TRACKER</h1>
</div>
</div>
<!-- Form Canvas -->
<div class="p-stack-lg flex flex-col gap-stack-md">
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-primary uppercase flex items-center gap-1" for="email">
<span class="material-symbols-outlined text-[16px]" data-icon="badge">badge</span>
                    Work Email
                </label>
<div class="relative">
<input class="w-full bg-surface-container-low border-2 border-primary p-2 focus:outline-none focus:border-b-4 focus:border-r-4 transition-all font-data-mono text-data-mono text-primary placeholder:text-outline" id="email" placeholder="operator@warehouse.co" type="email"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-caps text-label-caps text-primary uppercase flex items-center justify-between" for="password">
<span class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
                        Password
                    </span>
<button class="text-secondary hover:underline cursor-pointer" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-2 border-primary p-2 focus:outline-none focus:border-b-4 focus:border-r-4 transition-all font-data-mono text-data-mono text-primary placeholder:text-outline" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-2 mt-stack-sm">
<input class="w-4 h-4 border-2 border-primary bg-surface-container-lowest checked:bg-secondary checked:border-primary focus:ring-0 focus:ring-offset-0 cursor-pointer appearance-none checked:after:content-['✓'] checked:after:text-primary checked:after:block checked:after:text-center checked:after:font-bold checked:after:text-xs" id="remember" type="checkbox"/>
<label class="font-data-mono text-data-mono text-on-surface-variant cursor-pointer" for="remember">Remember this device</label>
</div>
<button class="w-full mt-stack-sm bg-secondary text-primary border-2 border-primary p-3 font-headline-md text-headline-md uppercase text-center shadow-[4px_4px_0px_0px_rgba(6,14,26,1)] hover:bg-secondary-container transition-colors btn-press cursor-pointer" type="button">
                CLOCK IN
            </button>
<div class="flex items-center gap-4 my-stack-sm">
<div class="h-[2px] bg-primary flex-1"></div>
<span class="font-label-caps text-label-caps text-primary">OR</span>
<div class="h-[2px] bg-primary flex-1"></div>
</div>
<button class="w-full bg-surface-container-lowest text-primary border-2 border-primary p-3 font-data-mono text-data-mono flex items-center justify-center gap-2 shadow-[4px_4px_0px_0px_rgba(6,14,26,1)] hover:bg-surface-container-low transition-colors btn-press cursor-pointer" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                Continue with Google
            </button>
<div class="text-center mt-stack-md">
<a class="font-data-mono text-data-mono text-secondary hover:text-secondary-container hover:underline transition-colors" href="#">
                    New to the warehouse? Request Access
                </a>
</div>
</div>
<!-- Decorative Strip -->
<div class="h-2 w-full flex">
<div class="h-full bg-on-tertiary-container w-1/3"></div>
<div class="h-full bg-secondary w-1/3 border-l border-primary"></div>
<div class="h-full bg-error w-1/3 border-l border-primary"></div>
</div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
                eyeIcon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
                eyeIcon.setAttribute('data-icon', 'visibility');
            }
        }
    </script>
</body></html>
