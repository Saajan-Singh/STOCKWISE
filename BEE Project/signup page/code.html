<style>
        /* Custom styles for Kraft paper and Grid background */
        .bg-kraft {
            background-color: #F6F4EF;
        }
        .bg-dot-grid {
            background-image: radial-gradient(rgba(21, 28, 37, 0.3) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .text-amber-solid {
            color: #C77D2E;
        }
        .bg-amber-solid {
            background-color: #C77D2E;
        }
        
        /* Input and Focus Styles */
        input:focus, select:focus {
            outline: none;
            box-shadow: none;
        }
        
        /* Number input hide arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        /* Tooltip */
        .tooltip .tooltip-text {
            visibility: hidden;
            background-color: #151c25;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 8px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            width: max-content;
            max-width: 200px;
            font-size: 12px;
            line-height: 1.4;
        }
        .tooltip .tooltip-text::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #151c25 transparent transparent transparent;
        }
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
    </style>

<body class="bg-surface-container-high h-full font-body-md text-on-surface bg-dot-grid flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Suppress Nav Bars as this is a Transactional/Linear Sign Up Screen -->
<main class="w-full max-w-4xl bg-kraft border-[2px] border-primary relative shadow-[4px_4px_0px_0px_rgba(6,14,26,1)] flex flex-col min-h-[600px]">
<!-- Header -->
<header class="border-b-[2px] border-primary p-margin-desktop flex flex-col md:flex-row md:items-end md:justify-between gap-stack-sm bg-surface-container-lowest"><div class="w-full flex flex-col items-center justify-center space-y-stack-sm text-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">ACCESS TERMINAL</span>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1; font-size: 32px;">inventory_2</span>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary uppercase tracking-tight">REORDER TRACKER</h1>
</div>
<h2 class="font-headline-md text-primary uppercase mt-2">REQUEST ACCESS</h2>
</div></header>
<!-- Form Area -->
<form class="p-margin-desktop flex-grow flex flex-col md:grid md:grid-cols-2 gap-x-gutter gap-y-stack-lg">
<!-- Left Column: YOUR DETAILS -->
<div class="flex flex-col gap-stack-md">
<h2 class="font-label-caps text-label-caps text-primary border-b-[1px] border-outline pb-2 mb-2 uppercase">YOUR DETAILS</h2>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-primary" for="fullName">Full Name</label>
<input class="bg-surface-container-lowest border-[2px] border-primary focus:border-[3px] p-2 font-body-md text-on-surface transition-all h-[44px]" id="fullName" placeholder="JOHN DOE" required="" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-primary" for="workEmail">Work Email</label>
<input class="bg-surface-container-lowest border-[2px] border-primary focus:border-[3px] p-2 font-body-md text-on-surface transition-all h-[44px]" id="workEmail" placeholder="john@company.com" required="" type="email"/>
</div>
</div>
<!-- Right Column: BUSINESS DETAILS -->
<div class="flex flex-col gap-stack-md mt-stack-lg md:mt-0">
<h2 class="font-label-caps text-label-caps text-primary border-b-[1px] border-outline pb-2 mb-2 uppercase">BUSINESS DETAILS</h2>
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2">
<label class="font-label-caps text-label-caps text-primary" for="businessName">Business Name</label>
<div class="tooltip relative inline-flex">
<span class="material-symbols-outlined text-[16px] text-amber-solid cursor-help" style="font-variation-settings: 'FILL' 1;">info</span>
<span class="tooltip-text font-body-md">This becomes your warehouse workspace name</span>
</div>
</div>
<input class="bg-surface-container-lowest border-[2px] border-primary focus:border-[3px] p-2 font-body-md text-on-surface transition-all h-[44px]" id="businessName" placeholder="ACME LOGISTICS" required="" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-primary" for="role">Role</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-[2px] border-primary focus:border-[3px] p-2 font-body-md text-on-surface appearance-none transition-all h-[44px] cursor-pointer" id="role" required="">
<option disabled="" selected="" value="">Select Role</option>
<option value="manager">Warehouse Manager</option>
<option value="operator">Floor Operator</option>
<option value="admin">System Admin</option>
</select>
<span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none text-primary">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Footer Actions (Spans both columns on desktop) -->
<div class="md:col-span-2 flex flex-col gap-1 mt-stack-md">
<label class="font-label-caps text-label-caps text-primary flex items-center gap-1" for="password">
<span class="material-symbols-outlined text-[16px]">lock</span>
Password
</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-[2px] border-primary focus:border-[3px] p-2 pr-10 font-body-md text-on-surface transition-all h-[44px]" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div><div class="md:col-span-2 flex flex-col items-center gap-stack-md mt-stack-md pt-stack-md border-t-[1px] border-outline">
<button class="w-full md:w-auto min-w-[200px] bg-amber-solid border-[2px] border-primary font-label-caps text-label-caps text-primary py-3 px-6 uppercase tracking-widest hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-none shadow-[2px_2px_0px_0px_rgba(6,14,26,1)] transition-all flex items-center justify-center gap-2" type="submit">
                    REQUEST ACCESS
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<a class="font-body-md text-amber-solid hover:underline decoration-2 underline-offset-4" href="#">Already have access? Log In</a>
</div>
</form>
<!-- Decorative Bottom Strip -->
<div class="absolute bottom-0 left-0 w-full h-2 flex">
<div class="h-full bg-tertiary-fixed flex-[1]"></div>
<div class="h-full bg-amber-solid flex-[2]"></div>
<div class="h-full bg-error flex-[1]"></div>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibilityIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }

        function updateTeamSize(change) {
            const input = document.getElementById('teamSize');
            let currentValue = parseInt(input.value) || 1;
            let newValue = currentValue + change;
            
            if (newValue < 1) newValue = 1;
            if (newValue > 999) newValue = 999;
            
            input.value = newValue;
        }
    </script>
