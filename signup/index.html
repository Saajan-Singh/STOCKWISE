<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StockWise — Request access to the inventory reorder intelligence platform. Sign up to manage your warehouse smarter." />
  <title>Request Access — StockWise</title>

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/signup.css" />
</head>
<body>

  <!-- Dot-grid backdrop -->
  <div class="page-backdrop" aria-hidden="true"></div>

  <main class="signup-card" role="main">

    <!-- CARD HEADER -->
    <header class="card-header">
      <span class="terminal-label">ACCESS TERMINAL</span>

      <div class="wordmark-row">
        <span class="material-symbols-outlined wordmark-icon" aria-hidden="true">inventory_2</span>
        <h1 class="wordmark">STOCKWISE</h1>
      </div>

      <p class="card-subtitle">REQUEST ACCESS</p>
    </header>

    <!-- SIGN-UP FORM -->
    <form class="signup-form" id="signup-form" novalidate>

      <!-- Two-column detail grid -->
      <div class="details-grid">

        <!-- Left column: Your Details -->
        <fieldset class="detail-col" id="your-details">
          <legend class="col-legend">Your Details</legend>

          <div class="field-group">
            <label class="field-label" for="full-name">Full Name</label>
            <input
              class="field-input"
              type="text"
              id="full-name"
              name="fullName"
              placeholder="JOHN DOE"
              autocomplete="name"
              required
            />
            <span class="field-error" id="full-name-error" role="alert"></span>
          </div>

          <div class="field-group">
            <label class="field-label" for="work-email">Work Email</label>
            <input
              class="field-input"
              type="email"
              id="work-email"
              name="workEmail"
              placeholder="john@company.com"
              autocomplete="email"
              required
            />
            <span class="field-error" id="work-email-error" role="alert"></span>
          </div>
        </fieldset>

        <!-- Right column: Business Details -->
        <fieldset class="detail-col" id="business-details">
          <legend class="col-legend">Business Details</legend>

          <div class="field-group">
            <div class="label-row">
              <label class="field-label" for="business-name">Business Name</label>
              <span class="tooltip-anchor" id="biz-tooltip-trigger" tabindex="0" aria-describedby="biz-tooltip">
                <span class="material-symbols-outlined info-icon" aria-hidden="true">info</span>
              </span>
              <div class="tooltip-bubble" id="biz-tooltip" role="tooltip">
                This becomes your warehouse workspace name
              </div>
            </div>
            <input
              class="field-input"
              type="text"
              id="business-name"
              name="businessName"
              placeholder="ACME LOGISTICS"
              autocomplete="organization"
              required
            />
            <span class="field-error" id="business-name-error" role="alert"></span>
          </div>

          <div class="field-group">
            <label class="field-label" for="role">Role</label>
            <div class="select-wrapper">
              <select class="field-input field-select" id="role" name="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="manager">Warehouse Manager</option>
                <option value="operator">Floor Operator</option>
                <option value="admin">System Admin</option>
                <option value="analyst">Inventory Analyst</option>
                <option value="supervisor">Logistics Supervisor</option>
              </select>
              <span class="material-symbols-outlined select-chevron" aria-hidden="true">arrow_drop_down</span>
            </div>
            <span class="field-error" id="role-error" role="alert"></span>
          </div>
        </fieldset>

      </div>

      <!-- Full-width Password field -->
      <div class="field-group field-group--full" id="password-group">
        <label class="field-label field-label--icon" for="password">
          <span class="material-symbols-outlined label-icon" aria-hidden="true">lock</span>
          Password
        </label>
        <div class="password-wrapper">
          <input
            class="field-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="new-password"
            required
            minlength="8"
          />
          <button
            class="password-toggle"
            type="button"
            id="password-toggle"
            aria-label="Toggle password visibility"
            aria-controls="password"
            aria-pressed="false"
          >
            <span class="material-symbols-outlined" id="password-toggle-icon">visibility_off</span>
          </button>
        </div>
        <span class="field-error" id="password-error" role="alert"></span>
        <!-- Password strength meter -->
        <div class="strength-bar-row" id="strength-bar-row" aria-hidden="true">
          <div class="strength-segment" id="str-seg-1"></div>
          <div class="strength-segment" id="str-seg-2"></div>
          <div class="strength-segment" id="str-seg-3"></div>
          <div class="strength-segment" id="str-seg-4"></div>
        </div>
        <span class="strength-label" id="strength-label"></span>
      </div>

      <!-- Divider + CTA -->
      <div class="form-footer">
        <button class="btn-request" type="submit" id="btn-request-access">
          <span class="btn-text">REQUEST ACCESS</span>
          <span class="material-symbols-outlined btn-arrow" aria-hidden="true">arrow_forward</span>
        </button>

        <a class="login-link" href="../login/index.html" id="login-link">
          Already have access? <strong>Log In</strong>
        </a>
      </div>

    </form>

    <!-- Decorative segmented gauge strip (bottom edge) -->
    <div class="gauge-strip" aria-hidden="true">
      <div class="gauge-segment gauge-segment--sage"></div>
      <div class="gauge-segment gauge-segment--amber"></div>
      <div class="gauge-segment gauge-segment--rust"></div>
    </div>

  </main>

  <!-- Toast notification -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="material-symbols-outlined toast-icon" id="toast-icon">check_circle</span>
    <span class="toast-msg" id="toast-msg"></span>
  </div>

  <script src="js/signup.js" defer></script>
</body>
</html>
