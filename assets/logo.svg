<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <!-- Icon Group -->
  <g transform="translate(12, 6)">
    <!-- Wireframe Box (Warehouse Amber) -->
    
    <!-- Back/Inner edges (lower opacity for depth) -->
    <path d="M 4 36 L 24 24 L 44 36 M 24 24 L 24 4" fill="none" stroke="#C77D2E" stroke-width="2.5" stroke-linejoin="round" opacity="0.4"/>
    
    <!-- Top opening edges -->
    <path d="M 24 4 L 4 16 L 24 28 L 44 16 Z" fill="none" stroke="#C77D2E" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Front and Side edges -->
    <path d="M 4 16 L 4 36 L 24 48 L 44 36 L 44 16 M 24 28 L 24 48" fill="none" stroke="#C77D2E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Arrow (Ink Navy) pointing up and out -->
    <!-- Path curving from bottom-left inside toward top-right -->
    <path d="M 10 34 Q 22 34, 32 14" fill="none" stroke="#1C2430" stroke-width="5" stroke-linecap="round"/>
    <!-- Arrowhead pointing up-right -->
    <polygon points="38,6 26,12 32,14 36,20" fill="#1C2430"/>
  </g>

  <!-- Wordmark -->
  <!-- Two visual weights in Warehouse Amber -->
  <text x="68" y="42" font-family="'Inter', sans-serif" font-size="34" fill="#C77D2E" letter-spacing="-0.02em">
    <tspan font-weight="800">STOCK</tspan><tspan font-weight="300">WISE</tspan>
  </text>
</svg>
