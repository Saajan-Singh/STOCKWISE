<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <!-- Icon Group -->
  <g transform="translate(12, 4)">
    <!-- 1. Inner Back Walls (gives the 3D open container look) -->
    <path d="M 4 20 L 24 8 L 24 32 Z" fill="#8c4f00" />
    <path d="M 24 8 L 44 20 L 24 32 Z" fill="#9e5a00" />
    
    <!-- 2. Outer Left Face (Solid Amber, slightly darker for depth) -->
    <path d="M 4 20 L 24 32 L 24 56 L 4 44 Z" fill="#b06b24" />
    
    <!-- 3. Outer Right Face (Solid Amber) -->
    <path d="M 24 32 L 44 20 L 44 44 L 24 56 Z" fill="#C77D2E" />
    
    <!-- 4. Box Edges (Amber Strokes for definition) -->
    <path d="M 4 20 L 24 32 L 44 20 M 24 32 L 24 56" fill="none" stroke="#e8a055" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 4 20 L 24 8 L 44 20" fill="none" stroke="#C77D2E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 4 20 L 4 44 L 24 56 L 44 44 L 44 20" fill="none" stroke="#C77D2E" stroke-width="2" stroke-linejoin="round"/>

    <!-- 5. Bold Arrow with Sharp Right-Angle Corner (Ink Navy #1C2430) -->
    <!-- White Halo Base -->
    <path d="M 14 42 L 14 27 L 22 22" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="miter"/>
    <polygon points="34,14 27,29 22,22 17,15" fill="#1C2430" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="miter" paint-order="stroke fill"/>
    
    <!-- Core Arrow -->
    <path d="M 14 42 L 14 27 L 22 22" fill="none" stroke="#1C2430" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="miter"/>
    <polygon points="34,14 27,29 22,22 17,15" fill="#1C2430"/>
  </g>

  <!-- Wordmark: Two weights in Warehouse Amber -->
  <text x="68" y="44" font-family="'Inter', sans-serif" font-size="36" fill="#C77D2E" letter-spacing="-0.02em">
    <tspan font-weight="800">STOCK</tspan><tspan font-weight="300">WISE</tspan>
  </text>
</svg>
