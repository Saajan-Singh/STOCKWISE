<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="StockWise — Clock in to your warehouse inventory management terminal. Log in to access your reorder dashboard." />
  <title>Clock In — StockWise Access Terminal</title>

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet" />
  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/login.css" />
</head>

<body>

  <!-- Dot-grid page backdrop -->
  <div class="page-backdrop" aria-hidden="true"></div>

  <!-- ── LOGIN CARD ── -->
  <main class="login-card" role="main" id="login-card">

    <!-- CARD HEADER -->
    <header class="card-header">
      <a href="../" class="wordmark-row"
        style="display: flex; justify-content: center; align-items: center; text-decoration: none; background-color: var(--ink-navy); padding: 16px 24px; border-radius: 8px; margin-bottom: 8px;">
        <img src="../assets/logo-icon.png" alt="StockWise Logo" style="height: 60px; width: auto;">
        <span
          style="color: var(--secondary-container); font-weight: 800; font-size: 32px; letter-spacing: -0.02em; margin-left: 4px; font-family: 'Inter', sans-serif;">STOCKWISE</span>
      </a>
      <span class="terminal-label">ACCESS TERMINAL</span>
    </header>

    <!-- LOGIN FORM -->
    <section class="form-canvas">
      <form class="login-form" id="login-form" novalidate>

        <!-- Work Email -->
        <div class="field-group">
          <label class="field-label" for="email">
            <span class="material-symbols-outlined label-icon" aria-hidden="true">badge</span>
            Work Email
          </label>
          <input class="field-input" type="email" id="email" name="email" placeholder="operator@warehouse.co"
            autocomplete="email" required />
          <span class="field-error" id="email-error" role="alert"></span>
        </div>

        <!-- Password -->
        <div class="field-group">
          <div class="password-label-row">
            <label class="field-label" for="password">
              <span class="material-symbols-outlined label-icon" aria-hidden="true">lock</span>
              Password
            </label>
            <button class="eye-toggle" type="button" id="password-toggle" aria-label="Toggle password visibility"
              aria-controls="password" aria-pressed="false">
              <span class="material-symbols-outlined" id="eye-icon">visibility</span>
            </button>
          </div>
          <input class="field-input" type="password" id="password" name="password" placeholder="••••••••"
            autocomplete="current-password" required />
          <span class="field-error" id="password-error" role="alert"></span>
        </div>

        <!-- Remember this device -->
        <div class="remember-row">
          <input class="remember-checkbox" type="checkbox" id="remember" name="remember" />
          <label class="remember-label" for="remember">Remember this device</label>
        </div>

        <!-- Clock In button -->
        <button class="btn-clock-in" type="submit" id="btn-clock-in">
          LOG IN
        </button>

        <!-- Success / error inline message -->
        <div class="login-message" id="login-message" role="status" aria-live="polite"></div>

        <!-- OR divider -->
        <div class="or-divider" aria-hidden="true">
          <div class="divider-line"></div>
          <span class="divider-text">OR</span>
          <div class="divider-line"></div>
        </div>

        <!-- Continue with Google -->
        <button class="btn-google" type="button" id="btn-google">
          <!-- Google G logo (official brand SVG) -->
          <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
            focusable="false">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Continue with Google
        </button>

        <!-- Sign-up link -->
        <div class="signup-row">
          <a class="signup-link" href="../signup/" id="signup-link">
            New to the warehouse? <strong>Request Access</strong>
          </a>
        </div>

      </form>
    </section>

    <!-- Decorative segmented gauge strip -->
    <div class="gauge-strip" aria-hidden="true">
      <div class="gauge-segment gauge-segment--sage"></div>
      <div class="gauge-segment gauge-segment--amber"></div>
      <div class="gauge-segment gauge-segment--rust"></div>
    </div>

  </main>

  <script src="../reorder-tool/js/config.js" defer></script>
  <script src="../reorder-tool/js/storage.js" defer></script>
  <script src="js/login.js" defer></script>
</body>

</html>
