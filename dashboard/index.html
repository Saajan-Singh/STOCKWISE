<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StockWise — Inventory reorder dashboard for your warehouse." />
  <title>Dashboard — StockWise</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- ── TOP NAVBAR ── -->
  <header class="navbar" role="banner">
    <div class="navbar__brand">
      <span class="material-symbols-outlined navbar__icon" aria-hidden="true">inventory_2</span>
      <span class="navbar__wordmark">STOCKWISE</span>
    </div>

    <nav class="navbar__actions" aria-label="User actions">
      <span class="navbar__user-label" id="navbar-user-label" aria-live="polite"></span>
      <a class="btn-logout" href="../login/index.html" id="btn-logout">
        <span class="material-symbols-outlined btn-logout__icon" aria-hidden="true">logout</span>
        Log Out
      </a>
    </nav>
  </header>

  <!-- ── MAIN CONTENT ── -->
  <main class="main-content" id="main-content">

    <!-- Welcome section (shown when session data exists) -->
    <section class="welcome-section" id="welcome-section" aria-label="Welcome">
      <div class="welcome-eyebrow">
        <span class="material-symbols-outlined welcome-eyebrow__icon" aria-hidden="true">waving_hand</span>
        <span class="welcome-eyebrow__text">GOOD TO SEE YOU</span>
      </div>
      <h1 class="welcome-heading" id="welcome-heading">Welcome back</h1>
      <p class="welcome-biz" id="welcome-biz"></p>
    </section>

    <!-- No-session fallback (shown when localStorage has no session data) -->
    <section class="no-session-section" id="no-session-section" aria-label="No active session">
      <span class="material-symbols-outlined no-session__icon" aria-hidden="true">lock</span>
      <h1 class="no-session__heading">No active session</h1>
      <p class="no-session__body">Please log in to access your dashboard.</p>
      <a class="btn-go-login" href="../login/index.html" id="btn-go-login">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        Go to Login
      </a>
    </section>

    <!-- Phase-2 placeholder card -->
    <div class="phase2-card" id="phase2-card" aria-label="Coming soon">
      <span class="material-symbols-outlined phase2-card__icon" aria-hidden="true">construction</span>
      <p class="phase2-card__label">PHASE 2</p>
      <p class="phase2-card__message">Full inventory dashboard coming in Phase 2</p>
      <p class="phase2-card__sub">Stock gauges · Reorder flags · Sales log · Forecast engine</p>
    </div>

  </main>

  <!-- ── FOOTER GAUGE STRIP (decorative) ── -->
  <div class="gauge-strip" aria-hidden="true">
    <div class="gauge-segment gauge-segment--sage"></div>
    <div class="gauge-segment gauge-segment--amber"></div>
    <div class="gauge-segment gauge-segment--rust"></div>
  </div>

  <script src="js/dashboard.js" defer></script>
</body>
</html>
